name: keep-green

# Monthly health check: does this project still build and pass its tests?
# A failed scheduled run emails the repo owner — silent rot becomes a signal.
on:
  schedule:
    - cron: "0 6 5 * *"
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Only pay for the Node toolchain in repos that actually have one; this
      # workflow is shared with JS projects, so the step stays, just guarded.
      - uses: actions/setup-node@v4
        if: hashFiles('package.json') != ''
        with:
          node-version: 22

      - uses: actions/cache@v4
        if: hashFiles('**/Cargo.lock') != ''
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build & test (auto-detected toolchain)
        run: |
          set -e
          ran=0
          if [ -f package.json ]; then
            ran=1
            PM=npm
            if [ -f pnpm-lock.yaml ]; then
              PM=pnpm; command -v pnpm >/dev/null || npm i -g pnpm
              pnpm install --frozen-lockfile
            elif [ -f yarn.lock ]; then
              PM=yarn; command -v yarn >/dev/null || npm i -g yarn
              yarn install --frozen-lockfile
            elif [ -f package-lock.json ]; then
              npm ci
            else
              npm install
            fi
            if node -e "process.exit((require('./package.json').scripts||{}).build?0:1)"; then $PM run build; fi
            if node -e "process.exit((require('./package.json').scripts||{}).test?0:1)"; then $PM run test; fi
          fi
          ct=$(find . -name Cargo.toml -not -path '*/target/*' -not -path '*/node_modules/*' | head -1)
          if [ -n "$ct" ]; then
            ran=1
            cd "$(dirname "$ct")"
            cargo fmt --check
            # --all-features throughout: optional features are exactly the code
            # nobody compiles locally, so without this the server binary rots
            # unnoticed while the default build stays green.
            if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
              cargo clippy --all-targets --all-features -- -D warnings
            else
              # Clippy only reports on the scheduled run: a future toolchain
              # adding a lint would otherwise fail the health check on untouched
              # code, the false alarm that trains you to ignore it.
              cargo clippy --all-targets --all-features || echo "::warning::clippy reported warnings (non-blocking on a scheduled run)"
            fi
            cargo build --all-features
            cargo test --all-features
            cd - >/dev/null
          fi
          if [ "$ran" = 0 ]; then echo "No recognized toolchain — nothing to check."; fi

      # A broken Dockerfile only shows up as a failed deploy otherwise, by which
      # point it is already on the default branch.
      - name: Build the container image
        if: hashFiles('Dockerfile') != ''
        run: docker build -t ${{ github.event.repository.name }}:ci .
