# Render blueprint. Point Render at this repo and it provisions the service
# from here rather than from settings typed into a dashboard, so the hosting is
# reviewable in the same place as the code.
#
# Deploy: render.com -> New -> Blueprint -> pick this repo.

services:
  - type: web
    name: substrate-node-probe
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    branch: master
    # Only rebuild when something that ends up in the image changes; a README
    # edit should not cost a container build.
    buildFilter:
      paths:
        - src/**
        - web/**
        - Cargo.toml
        - Cargo.lock
        - Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: RUST_LOG
        value: info
      # Deliberately absent: ALLOWED_ORIGIN. The page is served by this same
      # service, so requests are same-origin and need no CORS allowance. Set it
      # only if you point the GitHub Pages copy at this backend.
